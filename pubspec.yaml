name: challenger_207i
description: کنترلر هوشمند ۲۰۷i
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  usb_serial: ^0.5.1
  provider: ^6.0.5
  shared_preferences: ^2.2.2
  syncfusion_flutter_gauges: ^22.2.12
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Vazir-Regular.ttf
    - assets/fonts/Vazir-Bold.ttf
  fonts:
    - family: Vazir
      fonts:
        - asset: assets/fonts/Vazir-Regular.ttf
        - asset: assets/fonts/Vazir-Bold.ttf
          weight: 700
